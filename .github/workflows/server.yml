name: server

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'tests/noise/**'
      - '.github/workflows/server.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
