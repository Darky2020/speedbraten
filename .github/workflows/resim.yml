name: resim

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tools/resimbuild.sh'
      - 'tests/gold/**'
      - '.github/workflows/resim.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-gnu, aarch64-linux-gnu, x86_64-windows-gnu, x86_64-macos, aarch64-macos]
        zig: [0.15.1]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - run: bash tools/resimbuild.sh ${{ matrix.target }} out
      - uses: actions/upload-artifact@v4
        with:
          name: resim-${{ matrix.target }}-zig${{ matrix.zig }}
          path: out/sauer_resim-*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: buildlog-${{ matrix.target }}-zig${{ matrix.zig }}
          path: out/build-*.log

  run:
    needs: build
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-linux-gnu }
          - { os: windows-2022,     target: x86_64-windows-gnu }
          - { os: macos-15-intel,   target: x86_64-macos }
          - { os: macos-15,         target: aarch64-macos }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tests
            tools
      - uses: actions/download-artifact@v4
        with:
          name: resim-${{ matrix.target }}-zig0.15.1
          path: bin
      - uses: actions/cache@v4
        id: data
        with:
          path: resimdata-v1.tar.gz
          key: resimdata-v1
      - name: download game data
        if: steps.data.outputs.cache-hit != 'true'
        run: curl -fsSL -o resimdata-v1.tar.gz https://github.com/Darky2020/speedbraten/releases/download/resimdata-v1/resimdata-v1.tar.gz
      - name: unpack game data
        run: |
          echo "cee4c89fe19a16e0bbd574e1385c1044a08a4f21b03ff0aea66c18559a09a85c  resimdata-v1.tar.gz" | (sha256sum -c - || shasum -a 256 -c -)
          tar xzf resimdata-v1.tar.gz
      - name: re-simulate gold replays
        run: |
          chmod +x bin/sauer_resim-* || true
          exe=$(cd bin && pwd)/$(ls bin)
          gold=$(pwd)/tests/gold
          mkdir -p results
          fail=0
          cd resimdata
          for f in "$gold"/*.sbr; do
            name=$(basename "$f" .sbr)
            rm -rf ../home; mkdir -p ../home
            start=$(date +%s)
            set +e
            "$exe" -q../home "$f" > "../results/$name.json" 2> "../results/$name.log"
            code=$?
            set -e
            echo "$name: exit $code in $(( $(date +%s) - start ))s: $(tr -d '\r' < "../results/$name.json")"
            [ $code -eq 0 ] || { fail=1; grep -iE "desync|could not|different version|fatal" "../results/$name.log" | head -5; }
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.target }}
          path: results

  compare:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
      - name: final state hashes must match on every platform
        shell: bash
        run: |
          platforms=5
          [ "$(ls -d results/*/ | wc -l)" -eq $platforms ] || { echo "expected results from $platforms platforms, got: $(ls results)"; exit 1; }
          fail=0
          for name in $(ls results/*/ | grep '\.json$' | sort -u); do
            hashes=$(for d in results/*/; do [ -f "$d$name" ] && tr -d '\r' < "$d$name" | sed -n 's/.*"hash":"\([0-9a-f]\{48\}\)".*/\1/p'; done)
            count=$(echo "$hashes" | grep -c .)
            distinct=$(echo "$hashes" | grep . | sort -u | wc -l)
            echo "$name: $count/$platforms hashes, $distinct distinct: $(echo "$hashes" | grep . | sort -u | tr '\n' ' ')"
            if [ "$count" -ne $platforms ] || [ "$distinct" -ne 1 ]; then fail=1; fi
          done
          exit $fail
