// speedrun menus: run timer and speedometer settings, replay browser

sb_adjust = [ $arg1 (+fround $$arg1 $arg2) ]
// picks the race start and, during a race, respawns there
sb_racestart = [ racestart $arg1; if (inrace) [respawnnow] ]

// a "- value +" stepper for a float setting, inside a row
sb_step = [
    guistayopen [ guibutton "-" (concat sb_adjust $arg1 (-f 0 $arg2)) 0 ]
    guistrut 1
    guifield $arg1 4
    guistrut 1
    guistayopen [ guibutton "+" (concat sb_adjust $arg1 $arg2) 0 ]
]
// a table cell at least arg1 characters wide holding the controls in arg2
sb_box = [ guilist [ guistrut $arg1 1; guilist $arg2 ] ]
sb_hudsteps = [
    sb_box 10 (concat sb_step $arg1 0.05)
    sb_box 10 (concat sb_step $arg2 0.01)
    sb_box 10 (concat sb_step $arg3 0.01)
]

newgui speedrun [
    guilist [
        sb_cell 13 ""
        sb_cell 9 ""
        sb_cell 12 ""
        sb_cell 10 "^f7size"
        sb_cell 10 "^f7x"
        sb_cell 10 "^f7y"
    ]
    guilist [
        sb_cell 13 "run timer"
        sb_box 9 [guicheckbox "show" runtimer]
        sb_cell 12 ""
        sb_hudsteps runtimerscale runtimerx runtimery
    ]
    guilist [
        sb_cell 13 "speedometer"
        sb_box 9 [guicheckbox "show" speedometer]
        sb_box 12 [guicheckbox "3D speed" speedometer3d]
        sb_hudsteps speedometerscale speedometerx speedometery
    ]
    guilist [
        sb_cell 13 ""
        guicheckbox "smooth over " speedometersmooth
        guifield speedometersmoothms 5
        guitext " ms" 0
        guistrut 3
        guibutton "colours.." [showgui speedrun_colours]
    ]
    guistrut .5
    guicheckbox "show the ghost of your PB" ghost
    guilist [
        guicheckbox "show the time difference to the ghost" ghostdiff
        if $ghostdiff [
            guitext ", up to " 0
            guifield ghostdiffwindow 4
            guitext " s away" 0
            guistrut 2
            guitext "smooth " 0
            guifield ghostdiffsmooth 5
            guitext " ms" 0
        ]
    ]
    if (strcmp (ghostchoice source) "") [] [
        guilist [
            guitext "ghost on this map: " 0
            guistayopen [ guiradio "PB" sb_ghostsrc 0 [ghostsource pb] ]
            guistrut 1
            guistayopen [ guiradio "segmented PB" sb_ghostsrc 1 [ghostsource segpb] ]
            if (strcmp (ghostchoice source) "file") [ guitext (format "  ^f4%1" (ghostchoice file)) 0 ]
        ]
        guilist [
            guitext "ghost label " 0
            guifield sb_ghostlabel 20 [ghostlabel $sb_ghostlabel]
            guitext (format "  ^f4shown: %1" (ghostchoice name)) 0
        ]
    ]
    guilist [
        guicheckbox "normal runs race the segmented PB" ghostsegpb
        guistrut 2
        guitext "ghost opacity " 0
        guifield ghostalpha 5
    ]
    guistrut .5
    guibutton "menu background.." [showgui speedrun_background]
    guibutton "game HUD.." [showgui speedrun_gamehud]

    guitab "singleplayer"
    guicheckbox "hide dead monsters" hidedeadmonsters
    guicheckbox "slow motion ^f4(runs with it don't count as PBs)" slowmosp

    guitab "flagruns"
    guicheckbox "flagrun rules in CTF (next map)" flagrun
    guicheckbox "walking back onto the flag restarts the timer" flagrunrestart
    guistrut .5
    guilist [
        sb_cell 16 "set flagrun spawn"
        sb_setspawnbinds = (searchbinds setspawn)
        guikeyfield sb_setspawnbinds -12 [
            looplist j (searchbinds setspawn) [bind $j ""]
            looplist j $sb_setspawnbinds [bind $j setspawn]
        ]
        guistrut 1
        guistayopen [ guibutton "clear" [clearspawn] ]
    ]
    guistrut .5
    guicheckbox "replays hold only the life of the run" replaylifeonly

    guitab "races"
    guicheckbox "race rules in ffa / coop edit (next map)" racerules
    guilist [
        guitext "race start: " 0
        guistayopen [ guibutton "random" [sb_racestart -1] ]
        guistrut 1
        guistayopen [ guibutton "<" [sb_racestart (max 0 (- $racestart 1))] ]
        guitext (? (< $racestart 0) " random " (format " %1 of %2 " (+ $racestart 1) (racestartcount))) 0
        guistayopen [ guibutton ">" [sb_racestart (max 0 (min (- (racestartcount) 1) (+ $racestart 1)))] ]
    ]
    guistrut .5
    guicheckbox "replays hold only the life of the run" replaylifeonly

    guitab "keys"
    sb_keystab

    guitab "stats"
    guibutton "open stats.." [showgui speedrun_stats]

    guitab "splits"
    sb_splitstab

    guitab "replays"
    guitext (format "replays saved: %1" (replaysaved)) 0
    guibutton "open replay browser.." [showgui speedrun_replays]
    guibutton "cleanup rules.." [sb_ncleanup = -1; showgui speedrun_cleanup]
    guistrut .5
    sb_replaysettings

    guitab "witness"
    sb_witnesshost = $witnesshost
    sb_witnessport = $witnessport
    guilist [ sb_cell 10 "address"; guifield sb_witnesshost 24 [witnesshost $sb_witnesshost] ]
    guilist [ sb_cell 10 "port"; guifield sb_witnessport 6 [witnessport $sb_witnessport] ]
    guistrut .5
    guitext (concatword "status: " (witnessstatuscolour) (witnessstatus)) 0
    if (witnesskeychanged) [
        guitext "^f3this address shows a different key than the one saved" 0
        guitext (concatword "^f3new key: " (witnessnewkey)) 0
        guibutton "trust the new key" [witnesstrustnewkey]
    ]
    guistrut .5
    if (&& (=s $witnesshost "") (!=s $hubwitnesshost "")) [
        guitext (format "^f7in use: %1:%2 (from the hub)" $hubwitnesshost $hubwitnessport) 0
    ] [
        guitext (concatword "^f7channel key: " (? (=s $witnesskey "") "not known yet" $witnesskey)) 0
        guitext (concatword "^f7signing key: " (? (=s $witnesssignkey "") "not known yet" $witnesssignkey)) 0
        guistayopen [ guibutton "ask the witness for its keys again" [witnessforgetkeys] ]
    ]

    guitab "hub"
    sb_hubtab

    guitab "boards"
    sb_boardstab
] "general" [sb_scanreplays; sb_ghostsrc = (? (strcmp (ghostchoice source) "segpb") 1 (? (strcmp (ghostchoice source) "file") 2 0)); sb_ghostlabel = (ghostchoice label)]

// a colour setting arg2 labelled arg1: hex field and a sample
sb_colourrow = [
    alias (concatword "sb_hex_" $arg2) (hexcolour $$arg2)
    guilist [
        sb_cell 30 $arg1
        guifield (concatword "sb_hex_" $arg2) 7 (format "%1 (concatword 0x $sb_hex_%1)" $arg2)
        guistrut 1
        guicolor $$arg2
        guistrut 2
        guibutton "edit.." (format "sb_pickopen [%1] $%2 [%2 $sb_pickcol]" $arg1 $arg2) 0
    ]
]

// Colour picker: sb_pickopen label colour apply opens it on colour (an integer); apply runs
// with $sb_pickcol holding the picked colour on every change.
sb_pickopen = [
    sb_picklabel = $arg1
    sb_pickcol = $arg2
    sb_pickapply = $arg3
    sb_pickr = (& (>> $arg2 16) 0xFF)
    sb_pickg = (& (>> $arg2 8) 0xFF)
    sb_pickb = (& $arg2 0xFF)
    sb_pickhex = (hexcolour $arg2)
    showgui speedrun_colourpick
]
sb_pickrgb = [
    sb_pickcol = (+ (+ (<< $sb_pickr 16) (<< $sb_pickg 8)) $sb_pickb)
    sb_pickhex = (hexcolour $sb_pickcol)
    sb_pickapply
]
sb_pickset = [
    sb_pickr = (& (>> $arg1 16) 0xFF)
    sb_pickg = (& (>> $arg1 8) 0xFF)
    sb_pickb = (& $arg1 0xFF)
    sb_pickrgb
]
// name, text colour code and value of each preset
sb_pickpresets = [
    white 7 0xFFFFFF grey 4 0x808080 green 0 0x40FF80 yellow 2 0xFFFF40
    orange 6 0xFF8040 red 3 0xFF4040 magenta 5 0xFF40FF blue 1 0x40A0FF
]

newgui speedrun_colourpick [
    guitext $sb_picklabel 0
    guilist [
        guicolor $sb_pickcol
        guistrut 2
        guitext "hex " 0
        guifield sb_pickhex 7 [sb_pickset (concatword 0x $sb_pickhex)]
    ]
    guistrut .5
    guitext "red" 0
    guislider sb_pickr 0 255 [sb_pickrgb]
    guitext "green" 0
    guislider sb_pickg 0 255 [sb_pickrgb]
    guitext "blue" 0
    guislider sb_pickb 0 255 [sb_pickrgb]
    guistrut .5
    guilist [
        loop k (div (listlen $sb_pickpresets) 3) [
            sb_p = (* $k 3)
            guistayopen [ guibutton (format "^f%1%2" (at $sb_pickpresets (+ $sb_p 1)) (at $sb_pickpresets $sb_p)) (concat sb_pickset (at $sb_pickpresets (+ $sb_p 2))) 0 ]
            guistrut 1
        ]
    ]
    guistrut .5
    guistayopen [ guibutton "done" [cleargui 1] ]
] "colour"

// The game HUD menu: edits the engine's gamehud, whose text shows in the bottom right corner above
// the fps counter (p1xbraten shows it under its own lines). A template is added as a new line.
sb_gamehudadd = [
    gamehud = (? (=s (getalias gamehud) "") $arg1 (concatword "concatword (" (getalias gamehud) ") ^"^^n^" (" $arg1 ")"))
]
// text with line breaks as one gui line each
sb_guilines = [
    local s i
    s = $arg1
    while [>= (strstr $s "^n") 0] [
        i = (strstr $s "^n")
        guitext (substr $s 0 $i) 0
        s = (substr $s (+ $i 1))
    ]
    guitext $s 0
]

newgui speedrun_gamehud [
    guitext "gamehud: a script whose text shows in the bottom right corner, above the fps counter" 0
    guitext "^f4^^n in its text starts a new line" 0
    guistrut .5
    guifield gamehud 64
    guistrut .5
    guilist [
        guitext "add a line: " 0
        guistayopen [
            guibutton "deaths" [sb_gamehudadd [format "%1 deaths" (getdeaths)]]
            guistrut 1
            guibutton "position" [sb_gamehudadd [format "(%1, %2, %3)" (+ (at (getcampos) 0) 0) (+ (at (getcampos) 1) 0) (+ (at (getcampos) 2) 0)]]
            guistrut 1
            guibutton "view angles" [sb_gamehudadd [format "(%1, %2)" (round (getcamyaw) 0.1) (round (getcampitch) 0.1)]]
            guistrut 1
            guibutton "speed" [sb_gamehudadd [format "speed %1" (getspeed)]]
        ]
        guispring
        guistayopen [ guibutton "clear" [gamehud = ""] ]
    ]
    guistrut .5
    guitext "^f4preview:" 0
    if (=s (getalias gamehud) "") [ guitext "^f4(empty)" 0 ] [ sb_guilines (gamehud) ]
] "game HUD"

newgui speedrun_colours [
    guitext "run timer" 0
    sb_colourrow "before the start" runtimeridlecolour
    sb_colourrow "running" runtimercolour
    sb_colourrow "finished: new PB" runtimerpbcolour
    sb_colourrow "finished: faster than the ghost" runtimerfastercolour
    sb_colourrow "finished: slower" runtimerslowercolour
    guibar
    guitext "speedometer, by horizontal speed" 0
    loop i (speedometerbandcount) [
        alias (concatword "sb_bandspeed" $i) (speedometerband $i speed)
        alias (concatword "sb_bandcol" $i) (speedometerband $i colour)
        sb_bandset = (format "speedometerbandset %1 $sb_bandspeed%1 $sb_bandcol%1" $i)
        guilist [
            guitext "from " 0
            guifield (concatword "sb_bandspeed" $i) 5 $sb_bandset
            guitext " u/s  colour " 0
            guifield (concatword "sb_bandcol" $i) 7 $sb_bandset
            guistrut 1
            guicolor (concatword 0x (speedometerband $i colour))
            guistrut 2
            guibutton "edit.." (format "sb_pickopen [band from %1] 0x%2 [speedometerbandset %3 %1 (hexcolour $sb_pickcol)]" (speedometerband $i speed) (speedometerband $i colour) $i) 0
            guistrut 2
            guistayopen [ guibutton "remove" (concat speedometerbandremove $i) 0 ]
        ]
    ]
    guistayopen [ guibutton "add band" [speedometerbandadd] ]
] "hud colours"

newgui speedrun_background [
    guilist [
        sb_cell 8 "image"
        sb_radios "default chosen random" menubackground []
    ]
    guilist [
        sb_cell 8 ""
        guicheckbox "show the logo" menubackgroundlogo
        guistrut 3
        guitext "switch every " 0
        guifield menubackgroundinterval 5
        guitext " s, fade " 0
        guifield menubackgroundfade 6
        guitext " ms" 0
    ]
    guitext "dim the image (%)" 0
    guislider menubackgrounddim 0 90
    guibar
    guinoautotab [
        if (= $sb_nbg 0) [
            guitext "no images yet: put .png or .jpg files in backgrounds/ in your home folder" 0
        ] [
            loop row 2 [
                guilist [
                    loop col 3 [
                        i = (+ (* $sb_bgpage 6) (+ (* $row 3) $col))
                        guilist [
                            if (< $i $sb_nbg) [
                                sb_bgfile = (menubackgroundfileat $i)
                                guistayopen [ guiimage $sb_bgfile (format "menubackgroundfile [%1]; menubackground 1" $sb_bgfile) 3 0 ]
                                sb_bgname = (substr $sb_bgfile 12)
                                guitext (format "%1%2" (? (strcmp $sb_bgfile $menubackgroundfile) "^f0> " "") $sb_bgname) 0
                            ] [ guistrut 13 1 ]
                        ]
                        guistrut 1
                    ]
                ]
            ]
        ]
    ]
    guilist [
        guistayopen [ guibutton "refresh list" [sb_nbg = (menubackgroundscan); sb_bgpage = 0] 0 ]
        guispring
        sb_pager sb_bgpage $sb_nbg 6
    ]
] "background" [sb_nbg = (menubackgroundscan); sb_bgpage = 0]

newgui speedrun_replays [ sb_replaylist ] "replays" [sb_scanreplays]
newgui speedrun_stats [ sb_statslist ] "stats" [sb_scanstats]

// a run kind with its mode in grey ("flagrun (effic ctf)"), or the mode alone
sb_hubkind = [ ? (=s $arg1 "") (concatword "^f4" $arg2) (format "%1 ^f4(%2)" $arg1 $arg2) ]
// one player of the hub grid (arg1: id): name, map, who plays along, and a button to join
sb_hubcard = [
    sb_hubp = $arg1
    sb_box 24 [
        guilist [
            guitext (concatword (? (= $sb_hubp (hubmyid)) "^f0" "") (hubplayer $sb_hubp name)) 0
            guitext (? (hubplayer $sb_hubp playing) (concatword "^f7" (hubplayer $sb_hubp map)) "^f4in the menus") 0
            guitext (? (hubplayer $sb_hubp playing) (sb_hubkind (hubplayer $sb_hubp kind) (hubplayer $sb_hubp mode)) "") 0
            if (!=s (hubplayer $sb_hubp following) "") [
                guitext (concatword "^f7with " (hubplayer $sb_hubp following)) 0
            ] [
                guitext (? (> (hubplayer $sb_hubp lobbysize) 1) (format "^f7%1 playing along" (- (hubplayer $sb_hubp lobbysize) 1)) "") 0
            ]
            guilist [
                if (&& (hubplayer $sb_hubp lobby) (!= $sb_hubp (hubmyid)) (|| (!= (hubplayer $sb_hubp lobby) (hubmylobby)) (!=s (hubspectating) ""))) [
                    guibutton "play along" (concat hubplayalong $sb_hubp)
                    guistrut 1
                ]
                if (&& (hubplayer $sb_hubp playing) (!= $sb_hubp (hubmyid))) [
                    guibutton "spectate" (concat hubspectate $sb_hubp)
                ]
                guitext "" 0
            ]
        ]
    ]
]
// every player on the hub, three to a row
sb_hubgrid = [
    sb_hubids = (hubplayers)
    sb_hubn = (listlen $sb_hubids)
    guitext (format "online: %1" $sb_hubn) 0
    loop sb_hubr (div (+ $sb_hubn 2) 3) [
        guilist [
            loop sb_hubc 3 [
                sb_hubi = (+ (* $sb_hubr 3) $sb_hubc)
                if (< $sb_hubi $sb_hubn) [ sb_hubcard (at $sb_hubids $sb_hubi) ]
            ]
        ]
        guistrut .3
    ]
]

// the boards tab: the witnessed leaderboard of the map being played
sb_boardstab = [
    if (hubboardinfo have) [
        guitext (format "%1 ^f7%2" (hubboardinfo map) (hubboardinfo kind)) 0
        guistrut .5
        if (hubboardinfo count) [
            loop sb_bi (hubboardinfo count) [
                guilist [
                    sb_cell 3 (concatword "#" (hubboardrow $sb_bi rank))
                    sb_cell 16 (hubboardrow $sb_bi name)
                    guitext (hubboardrow $sb_bi time) 0
                ]
            ]
        ] [ guitext "^f7no witnessed times yet" 0 ]
        guistrut .5
        if (hubboardinfo myrank) [
            guitext (format "you: #%1 %2" (hubboardinfo myrank) (hubboardinfo mytime)) 0
        ] [ guitext "^f7you: no witnessed time" 0 ]
    ] [
        guitext "^f7play a race, flagrun or campaign map to see its board" 0
    ]
    guistrut .5
    guistayopen [ guibutton "refresh" [hubboard] ]
    guitext "^f7all boards: leaderboard.sauerdemos.com" 0
]

// the hub tab: address, status, lobbies, who is online
sb_hubtab = [
    sb_hubhost = $hubhost
    sb_hubport = $hubport
    guilist [ sb_cell 10 "address"; guifield sb_hubhost 24 [hubhost $sb_hubhost] ]
    guilist [ sb_cell 10 "port"; guifield sb_hubport 6 [hubport $sb_hubport] ]
    guistrut .5
    guitext (concatword "status: " (hubstatuscolour) (hubstatus)) 0
    if (hubkeychanged) [
        guitext "^f3this address shows a different key than the one saved" 0
        guitext (concatword "^f3new key: " (hubnewkey)) 0
        guibutton "trust the new key" [hubtrustnewkey]
    ]
    if (=s (hubstatus) "connected") [
        guitext (concatword "name: " (? (=s (hubname) "") "^f3none yet" (hubname))) 0
        if (!=s (hubnamerefusal) "") [ guitext (concatword "^f3" (hubnamerefusal)) 0 ]
        guistrut .5
        if (!=s (hubspectating) "") [
            guitext (format "^f2spectating %1 ^f7(%2 s behind)" (hubspectating) (hubspectatebehind)) 0
            guibutton "stop spectating" [hubstopspectate]
            guistrut .5
        ]
        sb_hublobby = (hubmylobby)
        if (&& $sb_hublobby (=s (hubspectating) "")) [
            if (hubishost) [
                guitext (format "your lobby: %1, %2^f7, %3 playing" (hublobby $sb_hublobby map) (sb_hubkind (hublobby $sb_hublobby kind) (hublobby $sb_hublobby mode)) (hublobby $sb_hublobby count)) 0
            ] [
                guitext (format "playing along with %1: %2, %3" (hublobby $sb_hublobby host) (hublobby $sb_hublobby map) (sb_hubkind (hublobby $sb_hublobby kind) (hublobby $sb_hublobby mode))) 0
                guilist [ guibutton "go to their map" [hubgo]; guistrut 1; guistayopen [ guibutton "leave" [hubleave] ] ]
            ]
        ]
        guistrut .5
        sb_hubgrid
    ]
    guistayopen [ guibutton "ask the hub for its key again" [hubforgetkey] ]
]

sb_keystab = [
    guilist [
        sb_cell 16 "restart run"
        sb_resetbinds = (searchbinds speedrunreset)
        guikeyfield sb_resetbinds -12 [
            looplist j (searchbinds speedrunreset) [bind $j ""]
            looplist j $sb_resetbinds [bind $j speedrunreset]
        ]
        guitext "  after " 0
        guifield speedrunresetidle 5
        guitext " ms still" 0
    ]
    guilist [
        sb_cell 16 "suicide + respawn"
        sb_respawnbinds = (searchbinds speedrunrespawn)
        guikeyfield sb_respawnbinds -12 [
            looplist j (searchbinds speedrunrespawn) [bind $j ""]
            looplist j $sb_respawnbinds [bind $j speedrunrespawn]
        ]
    ]
    guistrut .5
    guilist [
        sb_cell 16 "save state"
        sb_savebinds = (searchbinds savestate)
        guikeyfield sb_savebinds -12 [
            looplist j (searchbinds savestate) [bind $j ""]
            looplist j $sb_savebinds [bind $j savestate]
        ]
    ]
    guilist [
        sb_cell 16 "load saved state"
        sb_loadbinds = (searchbinds loadstate)
        guikeyfield sb_loadbinds -12 [
            looplist j (searchbinds loadstate) [bind $j ""]
            looplist j $sb_loadbinds [bind $j loadstate]
        ]
    ]
    guilist [
        sb_cell 16 "step back"
        sb_autobinds = (searchbinds loadautostate)
        guikeyfield sb_autobinds -12 [
            looplist j (searchbinds loadautostate) [bind $j ""]
            looplist j $sb_autobinds [bind $j loadautostate]
        ]
    ]
    guilist [
        sb_cell 16 "previous door"
        sb_prevdoorbinds = (searchbinds prevdoor)
        guikeyfield sb_prevdoorbinds -12 [
            looplist j (searchbinds prevdoor) [bind $j ""]
            looplist j $sb_prevdoorbinds [bind $j prevdoor]
        ]
    ]
    guilist [
        sb_cell 16 "next door"
        sb_nextdoorbinds = (searchbinds nextdoor)
