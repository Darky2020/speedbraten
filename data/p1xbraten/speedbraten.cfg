// speedrun menus: run timer and speedometer settings, replay browser

sb_adjust = [ $arg1 (+fround $$arg1 $arg2) ]
// picks the race start and, during a race, respawns there
sb_racestart = [ racestart $arg1; if (inrace) [respawnnow] ]

// a "- value +" stepper for a float setting, inside a row
sb_step = [
    guistayopen [ guibutton "-" (concat sb_adjust $arg1 (-f 0 $arg2)) 0 ]
    guistrut 1
    guifield $arg1 4
    guistrut 1
    guistayopen [ guibutton "+" (concat sb_adjust $arg1 $arg2) 0 ]
]
// a table cell at least arg1 characters wide holding the controls in arg2
sb_box = [ guilist [ guistrut $arg1 1; guilist $arg2 ] ]
sb_hudsteps = [
    sb_box 10 (concat sb_step $arg1 0.05)
    sb_box 10 (concat sb_step $arg2 0.01)
    sb_box 10 (concat sb_step $arg3 0.01)
]

newgui speedrun [
    guilist [
        sb_cell 13 ""
        sb_cell 9 ""
        sb_cell 12 ""
        sb_cell 10 "^f7size"
        sb_cell 10 "^f7x"
        sb_cell 10 "^f7y"
    ]
    guilist [
        sb_cell 13 "run timer"
        sb_box 9 [guicheckbox "show" runtimer]
        sb_cell 12 ""
        sb_hudsteps runtimerscale runtimerx runtimery
    ]
    guilist [
        sb_cell 13 "speedometer"
        sb_box 9 [guicheckbox "show" speedometer]
        sb_box 12 [guicheckbox "3D speed" speedometer3d]
        sb_hudsteps speedometerscale speedometerx speedometery
    ]
    guilist [
        sb_cell 13 ""
        guicheckbox "smooth over " speedometersmooth
        guifield speedometersmoothms 5
        guitext " ms" 0
        guistrut 3
        guibutton "colours.." [showgui speedrun_colours]
    ]
    guistrut .5
    guicheckbox "show the ghost of your PB" ghost
    guilist [
        guicheckbox "show the time difference to the ghost" ghostdiff
        if $ghostdiff [
            guitext ", up to " 0
            guifield ghostdiffwindow 4
            guitext " s away" 0
        ]
    ]
    if (strcmp (ghostchoice source) "") [] [
        guilist [
            guitext "ghost on this map: " 0
            guistayopen [ guiradio "PB" sb_ghostsrc 0 [ghostsource pb] ]
            guistrut 1
            guistayopen [ guiradio "segmented PB" sb_ghostsrc 1 [ghostsource segpb] ]
            if (strcmp (ghostchoice source) "file") [ guitext (format "  ^f4%1" (ghostchoice file)) 0 ]
        ]
        guilist [
            guitext "ghost label " 0
            guifield sb_ghostlabel 20 [ghostlabel $sb_ghostlabel]
            guitext (format "  ^f4shown: %1" (ghostchoice name)) 0
        ]
    ]
    guilist [
        guicheckbox "normal runs race the segmented PB" ghostsegpb
        guistrut 2
        guitext "ghost opacity " 0
        guifield ghostalpha 5
    ]

    guitab "singleplayer"
    guicheckbox "hide dead monsters" hidedeadmonsters
    guicheckbox "slow motion ^f4(runs with it don't count as PBs)" slowmosp

    guitab "flagruns"
    guicheckbox "flagrun rules in CTF (next map)" flagrun
    guicheckbox "walking back onto the flag restarts the timer" flagrunrestart
    guistrut .5
    guilist [
        sb_cell 16 "set flagrun spawn"
        sb_setspawnbinds = (searchbinds setspawn)
        guikeyfield sb_setspawnbinds -12 [
            looplist j (searchbinds setspawn) [bind $j ""]
            looplist j $sb_setspawnbinds [bind $j setspawn]
        ]
        guistrut 1
        guistayopen [ guibutton "clear" [clearspawn] ]
    ]
    guistrut .5
    guicheckbox "replays hold only the life of the run" replaylifeonly

    guitab "races"
    guicheckbox "race rules in ffa / coop edit (next map)" racerules
    guilist [
        guitext "race start: " 0
        guistayopen [ guibutton "random" [sb_racestart -1] ]
        guistrut 1
        guistayopen [ guibutton "<" [sb_racestart (max 0 (- $racestart 1))] ]
        guitext (? (< $racestart 0) " random " (format " %1 of %2 " (+ $racestart 1) (racestartcount))) 0
        guistayopen [ guibutton ">" [sb_racestart (max 0 (min (- (racestartcount) 1) (+ $racestart 1)))] ]
    ]
    guistrut .5
    guicheckbox "replays hold only the life of the run" replaylifeonly

    guitab "keys"
    sb_keystab

    guitab "stats"
    guibutton "open stats.." [showgui speedrun_stats]

    guitab "splits"
    sb_splitstab

    guitab "replays"
    guitext (format "%1 replays saved" $sb_nreplays) 0
    guibutton "open replay browser.." [showgui speedrun_replays]
    guibutton "cleanup rules.." [sb_ncleanup = -1; showgui speedrun_cleanup]
    guistrut .5
    sb_replaysettings
] "general" [sb_scanreplays; sb_ghostsrc = (? (strcmp (ghostchoice source) "segpb") 1 (? (strcmp (ghostchoice source) "file") 2 0)); sb_ghostlabel = (ghostchoice label)]

// a colour setting arg2 labelled arg1: hex field and a sample
sb_colourrow = [
    alias (concatword "sb_hex_" $arg2) (hexcolour $$arg2)
    guilist [
        sb_cell 30 $arg1
        guifield (concatword "sb_hex_" $arg2) 7 (format "%1 (concatword 0x $sb_hex_%1)" $arg2)
        guistrut 1
        guicolor $$arg2
        guistrut 2
        guibutton "edit.." (format "sb_pickopen [%1] $%2 [%2 $sb_pickcol]" $arg1 $arg2) 0
    ]
]

// Colour picker: sb_pickopen label colour apply opens it on colour (an integer); apply runs
// with $sb_pickcol holding the picked colour on every change.
sb_pickopen = [
    sb_picklabel = $arg1
    sb_pickcol = $arg2
    sb_pickapply = $arg3
    sb_pickr = (& (>> $arg2 16) 0xFF)
    sb_pickg = (& (>> $arg2 8) 0xFF)
    sb_pickb = (& $arg2 0xFF)
    sb_pickhex = (hexcolour $arg2)
    showgui speedrun_colourpick
]
sb_pickrgb = [
    sb_pickcol = (+ (+ (<< $sb_pickr 16) (<< $sb_pickg 8)) $sb_pickb)
    sb_pickhex = (hexcolour $sb_pickcol)
    sb_pickapply
]
sb_pickset = [
    sb_pickr = (& (>> $arg1 16) 0xFF)
    sb_pickg = (& (>> $arg1 8) 0xFF)
    sb_pickb = (& $arg1 0xFF)
    sb_pickrgb
]
// name, text colour code and value of each preset
sb_pickpresets = [
    white 7 0xFFFFFF grey 4 0x808080 green 0 0x40FF80 yellow 2 0xFFFF40
    orange 6 0xFF8040 red 3 0xFF4040 magenta 5 0xFF40FF blue 1 0x40A0FF
]

newgui speedrun_colourpick [
    guitext $sb_picklabel 0
    guilist [
        guicolor $sb_pickcol
        guistrut 2
        guitext "hex " 0
        guifield sb_pickhex 7 [sb_pickset (concatword 0x $sb_pickhex)]
    ]
    guistrut .5
    guitext "red" 0
    guislider sb_pickr 0 255 [sb_pickrgb]
    guitext "green" 0
    guislider sb_pickg 0 255 [sb_pickrgb]
    guitext "blue" 0
    guislider sb_pickb 0 255 [sb_pickrgb]
    guistrut .5
    guilist [
        loop k (div (listlen $sb_pickpresets) 3) [
            sb_p = (* $k 3)
            guistayopen [ guibutton (format "^f%1%2" (at $sb_pickpresets (+ $sb_p 1)) (at $sb_pickpresets $sb_p)) (concat sb_pickset (at $sb_pickpresets (+ $sb_p 2))) 0 ]
            guistrut 1
        ]
    ]
    guistrut .5
    guistayopen [ guibutton "done" [cleargui 1] ]
] "colour"

newgui speedrun_colours [
    guitext "run timer" 0
    sb_colourrow "before the start" runtimeridlecolour
    sb_colourrow "running" runtimercolour
    sb_colourrow "finished: new PB" runtimerpbcolour
    sb_colourrow "finished: faster than the ghost" runtimerfastercolour
    sb_colourrow "finished: slower" runtimerslowercolour
    guibar
    guitext "speedometer, by horizontal speed" 0
    loop i (speedometerbandcount) [
        alias (concatword "sb_bandspeed" $i) (speedometerband $i speed)
        alias (concatword "sb_bandcol" $i) (speedometerband $i colour)
        sb_bandset = (format "speedometerbandset %1 $sb_bandspeed%1 $sb_bandcol%1" $i)
        guilist [
            guitext "from " 0
            guifield (concatword "sb_bandspeed" $i) 5 $sb_bandset
            guitext " u/s  colour " 0
            guifield (concatword "sb_bandcol" $i) 7 $sb_bandset
            guistrut 1
            guicolor (concatword 0x (speedometerband $i colour))
            guistrut 2
            guibutton "edit.." (format "sb_pickopen [band from %1] 0x%2 [speedometerbandset %3 %1 (hexcolour $sb_pickcol)]" (speedometerband $i speed) (speedometerband $i colour) $i) 0
            guistrut 2
            guistayopen [ guibutton "remove" (concat speedometerbandremove $i) 0 ]
        ]
    ]
    guistayopen [ guibutton "add band" [speedometerbandadd] ]
] "hud colours"

newgui speedrun_replays [ sb_replaylist ] "replays" [sb_scanreplays]
newgui speedrun_stats [ sb_statslist ] "stats" [sb_scanstats]

sb_keystab = [
    guilist [
        sb_cell 16 "restart run"
        sb_resetbinds = (searchbinds speedrunreset)
        guikeyfield sb_resetbinds -12 [
            looplist j (searchbinds speedrunreset) [bind $j ""]
            looplist j $sb_resetbinds [bind $j speedrunreset]
        ]
        guitext "  after " 0
        guifield speedrunresetidle 5
        guitext " ms still" 0
    ]
    guilist [
        sb_cell 16 "suicide + respawn"
        sb_respawnbinds = (searchbinds speedrunrespawn)
        guikeyfield sb_respawnbinds -12 [
            looplist j (searchbinds speedrunrespawn) [bind $j ""]
            looplist j $sb_respawnbinds [bind $j speedrunrespawn]
        ]
    ]
    guistrut .5
    guilist [
        sb_cell 16 "save state"
        sb_savebinds = (searchbinds savestate)
        guikeyfield sb_savebinds -12 [
            looplist j (searchbinds savestate) [bind $j ""]
            looplist j $sb_savebinds [bind $j savestate]
        ]
    ]
    guilist [
        sb_cell 16 "load saved state"
        sb_loadbinds = (searchbinds loadstate)
        guikeyfield sb_loadbinds -12 [
            looplist j (searchbinds loadstate) [bind $j ""]
            looplist j $sb_loadbinds [bind $j loadstate]
        ]
    ]
    guilist [
        sb_cell 16 "step back"
        sb_autobinds = (searchbinds loadautostate)
        guikeyfield sb_autobinds -12 [
            looplist j (searchbinds loadautostate) [bind $j ""]
            looplist j $sb_autobinds [bind $j loadautostate]
        ]
    ]
    guilist [
        sb_cell 16 "auto state every"
        guifield autostateinterval 6
        guitext " ms, keep " 0
        guifield autostatecount 4
    ]
    guilist [
        sb_cell 16 "wait after load"
        guifield loadstatedelay 6
        guitext " ms" 0
    ]
]

sb_replaysettings = [
    guicheckbox "save replays automatically" replayautosave
    guilist [
        guitext "unfinished replays kept: " 0
        guifield replaymaxunfinished 4
    ]
]

sb_replaylist = [
    guilist [
        sb_cell 6 "map"
        guifield replayfilter 12 [sb_page = 0; sb_scanreplays]
        guistayopen [ guibutton "" [replayfilter ""; sb_page = 0; sb_scanreplays] "exit" ]
        guistrut 3
        guitext "sort " 0
        sb_radio "date" replaysort 0 [sb_scanreplays] 7
        sb_radio "finish time" replaysort 1 [sb_scanreplays] 12
        guispring
        guitext (format "^f4%1 replays, %2" $sb_nreplays (replaytotalsize)) 0
        guistrut 3
        sb_pager sb_page $sb_nreplays
    ]
    guilist [
        sb_cell 6 "kind"
        sb_radios "all sp dmsp flagrun race" replayfilterkind [sb_page = 0; sb_scanreplays]
    ]
    guilist [
        sb_cell 6 "show"
        sb_radios "all finished DNF" replayfilterresult [sb_page = 0; sb_scanreplays]
        sb_check "segmented only" replayfilterseg [sb_page = 0; sb_scanreplays] 16
        sb_check "kept only" replayfilterkept [sb_page = 0; sb_scanreplays] 11
        sb_check "PBs only" replayfilterpb [sb_page = 0; sb_scanreplays] 11
        guispring
        guistayopen [ guibutton "refresh" [sb_scanreplays] 0 ]
    ]
    sb_flagmoderow $replayfilterkind replayfilterflagmode [sb_page = 0; sb_scanreplays]
    guibar
    guilist [
        sb_cell 17 "^f7date"
        sb_cell 13 "^f7map"
        sb_cell 11 "^f7mode"
        sb_cell 9 "^f7time"
        sb_cell 6 "^f7length"
        sb_cell 8 "^f7size"
        sb_cell 5 ""
    ]
    loop j 10 [
        i = (+ (* $sb_page 10) $j)
        if (< $i $sb_nreplays) [
            guilist [
                guilist [
                    guistrut 17 1
                    guibutton (format "%1 %2" (replayfield $i date) (replayfield $i time)) (concat sb_openreplay $i) 0
                ]
                sb_cell 13 (replayfield $i map)
                sb_cell 11 (format "^f4%1" (replayfield $i mode))
                sb_cell 9 (format "^f%1%2" (? (replayfield $i finished) 0 7) (replayfield $i runtime))
                sb_cell 6 (format "^f4%1" (replayfield $i length))
                sb_cell 8 (format "^f4%1" (replayfield $i size))
                sb_cell 5 (? (replayfield $i kept) "^f2kept" "")
                sb_cell 4 (? (replayfield $i splices) "^f6seg" "")
                sb_cell 3 (? (replayfield $i pb) "^f0PB" "")
            ]
        ] [ guitext " " 0 ]
    ]
]

// kind radio buttons for the variable arg1, running arg2 on a change
// A radio button (label arg1, variable arg2, value arg3, onchange arg4) and a checkbox (label
// arg1, variable arg2, onchange arg3), each in a cell arg5 / arg4 characters wide.
sb_radio = [ sb_box $arg5 (format "guistayopen [ guiradio [%1] %2 %3 [%4] ]" $arg1 $arg2 $arg3 $arg4) ]
sb_check = [ sb_box $arg4 (format "guistayopen [ guicheckbox [%1] %2 1 0 [%3] ]" $arg1 $arg2 $arg3) ]
// radio buttons for the words of arg1, setting variable arg2 to 0, 1, ...; onchange arg3
sb_radios = [
    sb_radiowords = $arg1
    sb_radiovar = $arg2
    sb_radioaction = $arg3
    loop k (listlen $sb_radiowords) [ sb_radio (at $sb_radiowords $k) $sb_radiovar $k $sb_radioaction 10 ]
]
// with kind arg1 on flagruns: the flagrun mode variable arg2; otherwise an empty row of the same height
sb_flagmoderow = [
    if (= $arg1 3) [
        sb_flagmodevar = $arg2
        sb_flagmodeaction = $arg3
        guilist [ sb_cell 6 "mode"; sb_radios "all effic insta weaponless" $sb_flagmodevar $sb_flagmodeaction ]
    ] [ guitext " " 0 ]
]
// page arrows and number for the page variable arg1 over arg2 entries, 10 a page
sb_pager = [
    sb_pagevar = $arg1
    sb_pagecount = $arg2
    if (> $$sb_pagevar 0) [ guistayopen [ guibutton "<" (format "%1 = (- $%1 1)" $sb_pagevar) 0 ] ] [ guitext "^f4<" 0 ]
    guistrut 1
    guitext (format "page %1/%2" (+ $$sb_pagevar 1) (max 1 (div (+ $sb_pagecount 9) 10))) 0
    guistrut 1
    if (< (* (+ $$sb_pagevar 1) 10) $sb_pagecount) [ guistayopen [ guibutton ">" (format "%1 = (+ $%1 1)" $sb_pagevar) 0 ] ] [ guitext "^f4>" 0 ]
]

// a table cell at least arg1 characters wide
sb_cell = [ guilist [ guistrut $arg1 1; guitext $arg2 0 ] ]

sb_openreplay = [ sb_selected = $arg1; sb_newname = (replayfield $arg1 name); showgui speedrun_replay ]

sb_nreplays = 0
sb_page = 0
sb_ghostsrc = 0
sb_ghostlabel = ""
sb_selected = -1
sb_newname = ""
sb_scanreplays = [ sb_nreplays = (replayscan); if (>= (* $sb_page 10) $sb_nreplays) [sb_page = 0] ]

newgui speedrun_replay [
    guitext (replayfield $sb_selected name) 0
    guibar
    guitext (format "date: ^f7%1 %2" (replayfield $sb_selected date) (replayfield $sb_selected time)) 0
    guitext (format "map: ^f7%1 ^f4(%2 maps)" (replayfield $sb_selected map) (replayfield $sb_selected maps)) 0
    guitext (format "mode: ^f7%1%2" (replayfield $sb_selected mode) (? (replayfield $sb_selected flagrun) " (flagrun)" (? (replayfield $sb_selected race) " (race)" ""))) 0
    guitext (format "player: ^f7%1" (replayfield $sb_selected player)) 0
    guitext (format "run time: ^f7%1" (replayfield $sb_selected runtime)) 0
    if (replayfield $sb_selected splices) [ guitext (format "^f6segmented: %1 state loads" (replayfield $sb_selected splices)) 0 ]
    guitext (format "length: ^f7%1" (replayfield $sb_selected length)) 0
    guitext (format "size: ^f7%1" (replayfield $sb_selected size)) 0
    if (replayfield $sb_selected outdated) [ guitext "^f3made with an older build: will likely desync" 0 ]
    guibar
    guibutton "play" [cleargui; replayplay $sb_selected]
    guibutton "race against this run" [ghostrace (replayfield $sb_selected file) ""]
    guistayopen [ guibutton (? (replayfield $sb_selected kept) "unprotect (allow cleanup)" "keep (protect from cleanup)") [replaykeep $sb_selected] ]
    guilist [
        guifield sb_newname 30
        guistrut 1
        guistayopen [ guibutton "rename" [replayrename $sb_selected $sb_newname] ]
    ]
    guibutton "delete.." [showgui speedrun_delete]
] "replay"

newgui speedrun_delete [
    guitext (format "delete %1?" (replayfield $sb_selected name)) 0
    guibar
    guibutton "yes, delete" [replaydelete $sb_selected; sb_scanreplays; showgui speedrun_replays]
    guibutton "no" [showgui speedrun_replay]
] "delete replay"

// run statistics: started runs per map, runs with state loads counted apart as segmented
sb_statsfilter = ""
sb_nstats = 0
sb_statspage = 0
sb_scanstats = [ sb_nstats = (statsscan $sb_statsfilter); if (>= (* $sb_statspage 10) $sb_nstats) [sb_statspage = 0] ]

sb_statslist = [
    guilist [
        sb_cell 6 "map"
        guifield sb_statsfilter 12 [sb_statspage = 0; sb_scanstats]
        guistayopen [ guibutton "" [sb_statsfilter = ""; sb_statspage = 0; sb_scanstats] "exit" ]
        guistrut 3
        guitext "sort " 0
        sb_radios "recent map runs played" statssort [sb_statspage = 0; sb_scanstats]
        guispring
        sb_pager sb_statspage $sb_nstats
    ]
    guilist [
        sb_cell 6 "kind"
        sb_radios "all sp dmsp flagrun race" statskind [sb_statspage = 0; sb_scanstats]
        sb_check "with a PB only" statspbonly [sb_statspage = 0; sb_scanstats] 16
    ]
    sb_flagmoderow $statskind statsflagmode [sb_statspage = 0; sb_scanstats]
    guibar
    guilist [
        sb_cell 14 "^f7map"
        sb_cell 17 "^f7kind"
        sb_cell 9 "^f7PB"
        sb_cell 8 "^f7PB date"
        sb_cell 9 "^f7avg (10)"
        sb_cell 8 "^f7finished"
        sb_cell 8 "^f7played"
        sb_cell 13 "^f6seg PB"
    ]
    loop j 10 [
        i = (+ (* $sb_statspage 10) $j)
        if (< $i $sb_nstats) [
            guilist [
                guilist [
                    guistrut 14 1
                    guibutton (statsmapfield $i map) (concat sb_openstats $i) 0
                ]
                sb_cell 17 (format "^f4%1" (statsmapfield $i kindname))
                sb_cell 9 (format "^f0%1" (statsmapfield $i pb))
                sb_cell 8 (format "^f4%1" (statsmapfield $i pbdate))
                sb_cell 9 (statsmapfield $i avg)
                sb_cell 8 (format "^f4%1/%2" (statsmapfield $i finished) (statsmapfield $i runs))
                sb_cell 8 (format "^f4%1" (statsmapfield $i played))
                sb_cell 13 (? (statsmapfield $i segruns) (format "^f6%1 ^f4(%2)" (statsmapfield $i segpb) (statsmapfield $i segruns)) "")
            ]
        ] [ guitext " " 0 ]
    ]
]

sb_statsmap = ""
sb_statskind = ""
sb_statsmode = 0
sb_statskindname = ""
sb_nattempts = 0
sb_attemptspage = 0
sb_openstats = [
    sb_statsmap = (statsmapfield $arg1 map)
    sb_statskind = (statsmapfield $arg1 kind)
    sb_statsmode = (statsmapfield $arg1 mode)
    sb_statskindname = (statsmapfield $arg1 kindname)
    sb_attemptspage = 0
    showgui speedrun_mapstats
]

newgui speedrun_mapstats [
    sb_nattempts = (statsattempts $sb_statsmap $sb_statskind $sb_statsmode)
    guilist [
        guitext (format "%1 ^f4(%2), newest first" $sb_statsmap $sb_statskindname) 0
        guispring
        if (> $sb_attemptspage 0) [ guistayopen [ guibutton "< newer" [sb_attemptspage = (- $sb_attemptspage 1)] ] ]
        guitext (format " page %1/%2 " (+ $sb_attemptspage 1) (max 1 (div (+ $sb_nattempts 9) 10))) 0
        if (< (* (+ $sb_attemptspage 1) 10) $sb_nattempts) [ guistayopen [ guibutton "older >" [sb_attemptspage = (+ $sb_attemptspage 1)] ] ]
    ]
    guibar
    guilist [
        sb_cell 17 "^f7date"
        sb_cell 10 "^f7time"
        sb_cell 9 "^f7played"
        sb_cell 9 "^f7longest idle"
        sb_cell 5 ""
        sb_cell 6 ""
    ]
    loop j 10 [
        i = (+ (* $sb_attemptspage 10) $j)
        if (< $i $sb_nattempts) [
            guilist [
                guilist [
                    guistrut 17 1
                    if (strcmp (statsattemptfield $i replay) "") [
                        guitext (format "^f4%1 %2" (statsattemptfield $i date) (statsattemptfield $i time)) 0
                    ] [
                        guibutton (format "%1 %2" (statsattemptfield $i date) (statsattemptfield $i time)) (concat "cleargui; statsplay" $i) "action"
                    ]
                ]
                sb_cell 10 (format "^f%1%2" (? (statsattemptfield $i finished) 0 7) (statsattemptfield $i runtime))
                sb_cell 9 (format "^f4%1" (statsattemptfield $i length))
                sb_cell 9 (format "^f4%1" (statsattemptfield $i idle))
                sb_cell 5 (? (statsattemptfield $i splices) "^f6seg" "")
                if (statsattemptfield $i finished) [
                    if (! (strcmp (statsattemptfield $i replay) "")) [
                        guistayopen [ guibutton "ghost" (concat ghostrace (statsattemptfield $i replay) [""]) ]
                    ]
                ]
            ]
        ] [ guitext " " 0 ]
    ]
] "runs"

// splits of the current map and run kind; editing needs edit mode (coop edit)
sb_splitname = ""
sb_splitstab = [
    guicheckbox "show splits under the timer" splithud
    guicheckbox "list every split" splitlist
    guicheckbox "show split zones while playing" splitshowzones
    guilist [
        guitext "fade splits out " 0
        guifield splitfade 6
        guitext " ms" 0
    ]
    guibar
    guitext (format "%1 splits on this map" (splitcount)) 0
    guibutton "edit splits.." [showgui speedrun_splitedit]
]

newgui speedrun_splitedit [
    guilist [
        guitext "editing the splits of " 0
        guistayopen [ guiradio "campaign" spliteditkind 0 ]
        guistrut 1
        guistayopen [ guiradio "flagrun" spliteditkind 1 ]
        guistrut 1
        guistayopen [ guiradio "race" spliteditkind 2 ]
    ]
    guibar
    loop i (splitcount) [
        guilist [
            sb_cell 14 (splitfield $i name)
            sb_cell 30 (format "^f4%1" (splitfield $i desc))
            guistayopen [ guibutton "rename" (concat splitrename $i [$sb_splitname] "; sb_splitname = []") ]
            guistrut 1
            guistayopen [ guibutton "delete" (concat splitremove $i) ]
        ]
    ]
    guibar
    guilist [
        guitext "name " 0
        guifield sb_splitname 16
    ]
    guistayopen [ guibutton "add zone from the edit selection" [if (splitaddzone $sb_splitname) [sb_splitname = ""]] ]
    guistayopen [ guibutton "add the item or teleport under the cursor" [if (splitaddent $sb_splitname) [sb_splitname = ""]] ]
    guistayopen [ guibutton "add a split the map script fires (splithere)" [if (splitaddscript $sb_splitname) [sb_splitname = ""]] ]
    guistayopen [ guibutton "save splits" [splitsave] ]
] "splits"

// replay cleanup rules: check lists what the rules would delete, delete removes it
sb_ckinds = "any sp flagrun race"
sb_cresults = "any unfinished finished"
sb_cconds = "shorter idle notstarted outdated older keepbest"
sb_cnames = ["shorter than (s)" "no input for over (s)" "run never started" "made with an older build" "older than (days)" "keep only the fastest"]
sb_ckind = 0
sb_cresult = 1
sb_ccond = 0
sb_cn = 5
sb_ncleanup = -1
sb_cycle = [ $arg1 = (mod (+ $$arg1 1) $arg2) ]

newgui speedrun_cleanup [
    loop i (cleanuprulecount) [
        guilist [
            sb_cell 40 (cleanupruletext $i)
            guistayopen [ guibutton "remove" [cleanupremove @i; sb_ncleanup = -1] ]
        ]
    ]
    if (= (cleanuprulecount) 0) [ guitext "no rules" 0 ]
    guibar
    guilist [
        guistayopen [ guibutton (at $sb_ckinds $sb_ckind) [sb_cycle sb_ckind 4] ]
        guistrut 1
        guistayopen [ guibutton (at $sb_cresults $sb_cresult) [sb_cycle sb_cresult 3] ]
        guistrut 1
        guistayopen [ guibutton (at $sb_cnames $sb_ccond) [sb_cycle sb_ccond 6] ]
        guistrut 1
        if (&& (!= $sb_ccond 2) (!= $sb_ccond 3)) [ guifield sb_cn 4 ]
        guistrut 1
        guistayopen [ guibutton "add rule" [cleanupadd (at $sb_ckinds $sb_ckind) (at $sb_cresults $sb_cresult) (at $sb_cconds $sb_ccond) $sb_cn; sb_ncleanup = -1] ]
    ]
    guibar
    guistayopen [ guibutton "check" [sb_ncleanup = (cleanupcheck)] ]
    if (>= $sb_ncleanup 0) [
        guitext (format "%1 replays (%2) would be deleted" $sb_ncleanup (cleanupsize)) 0
        loop j (min $sb_ncleanup 10) [ guitext (format "^f4%1" (cleanupfield $j file)) 0 ]
        if (> $sb_ncleanup 10) [ guitext (format "^f4... and %1 more" (- $sb_ncleanup 10)) 0 ]
        if (> $sb_ncleanup 0) [ guibutton (format "delete %1 replays.." $sb_ncleanup) [showgui speedrun_cleanupconfirm] ]
    ]
] "cleanup"

newgui speedrun_cleanupconfirm [
    guitext (format "delete %1 replays (%2)?" $sb_ncleanup (cleanupsize)) 0
    guibar
    guibutton "yes, delete" [cleanupdelete; sb_ncleanup = -1; sb_scanreplays; showgui speedrun_cleanup]
    guibutton "no" [showgui speedrun_cleanup]
] "delete replays"
