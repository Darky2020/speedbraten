// Savestate rewind on forge in a flagrun (rocket jumps, a suicide and the respawn after it).
// The state is saved at 4250 ms, while a rocket is in flight; at 9000 ms it is restored and
// the recorded input is replayed from there. Every replayed tick must hash exactly as it did
// when it was recorded. Prints REPLAYCHECK rewind desync=<first desync tick, 0 = none>
// replayed=<ticks replayed>. With $savestate_write set, the replay from the saved state is also
// written to that file.
rw_jump = [
    sleep $arg1 [harnessjump]
    sleep (+ $arg1 60) [harnessattack 1]
    sleep (+ $arg1 120) [harnessattack 0]
]
rw_inputs = [
    sleep 300 [harnesscommand "setweapon 3 1"; harnessaim 0 -89; harnessmove 1 0]
    loop k 9 [rw_jump (+ 600 (* $k 900))]
    sleep 4250 [savestate]
    sleep 6300 [harnesscommand suicide]
    sleep 7000 [harnessattack 1]
    sleep 7100 [harnessattack 0; harnessaim 90 -60]
    sleep 9000 [if (!=s $savestate_write "") [inputsavefromstate $savestate_write]; loadstatereplay; sleep 300 [echo (concatword "REPLAYCHECK rewind desync=" (inputdesync) " replayed=" (inputreplayed)); dethashstop; quit]]
]
soundvol 0
musicvol 0
flagrun 1
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log rw_inputs
mode 17
map forge
