// Rocket jumps in a flagrun (efficctf on forge, flagrun 1), recorded at maxfps $rj_recfps and
// replayed at maxfps $rj_repfps. Self-damage goes through the local server, so this checks the
// server's shot/explosion event timing. Expected: speed after each jump > 0, no desync.
rj_jump = [
    sleep $arg1 [harnessjump]
    sleep (+ $arg1 60) [harnessattack 1]
    sleep (+ $arg1 120) [harnessattack 0]
]
rj_check = [
    sleep (+ $arg1 300) [echo (concatword "REPLAYCHECK " $rj_phase " speed=" (getspeed 1) " state=" (harnessstate) " maxfps=" $maxfps " deaths=" (getdeaths) " frags=" (getfrags))]
]
rj_inputs = [
    rj_phase = record
    maxfps $rj_recfps
    sleep 300 [harnesscommand "setweapon 3 1"; harnessaim 0 -89; harnessmove 1 0]
    loop k 16 [rj_jump (+ 600 (* $k 900)); rj_check (+ 600 (* $k 900))]
    sleep 15200 [maxfps $rj_repfps; dethashstop; dethashstart dethash_replay.log rj_replay; inputreplay 0]
]
rj_replay = [
    rj_phase = replay
    loop k 16 [rj_check (+ 600 (* $k 900))]
    sleep 15100 [echo (concatword "REPLAYCHECK replay desync=" (inputdesync)); dethashstop; quit]
]
soundvol 0
musicvol 0
flagrun 1
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log rj_inputs
mode 17
map forge
