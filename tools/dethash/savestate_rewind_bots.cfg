// Savestate rewind in an offline ffa with two bots (AI state, routes, waypoints and the local
// server's bot clients) on $rwb_map (default forge; a map without a waypoint file, such as
// canyon, also covers waypoints dropped during play). The bots are added through recorded input; the state is
// saved at 6 s, restored at 12 s and the recorded input is replayed from there. Every replayed
// tick must hash exactly as it did when it was recorded.
// With $savestate_write set, the replay from the saved state is also written to that file.
// Prints REPLAYCHECK rewind desync=<first desync tick, 0 = none> replayed=<ticks replayed>.
// Then a bot is removed and loading the state must be refused ("...set of bots").
rwb_inputs = [
    sleep 300   [harnesscommand "addbot 80"; harnesscommand "addbot 80"]
    sleep 500   [harnessaim 90 0; harnessmove 1 0]
    sleep 2500  [harnessaim 180 0; harnessjump]
    sleep 4000  [harnessaim 270 -5; harnessattack 1]
    sleep 5000  [harnessattack 0; harnessmove 1 1]
    sleep 6000  [savestate]
    sleep 7000  [harnessaim 0 0; harnessmove 1 -1; harnessjump]
    sleep 9000  [harnessattack 1]
    sleep 10000 [harnessattack 0; harnessaim 120 0; harnessmove 1 0]
    sleep 12000 [
        if (!=s $savestate_write "") [inputsavefromstate $savestate_write]
        loadstatereplay
        sleep 300 [echo (concatword "REPLAYCHECK rewind desync=" (inputdesync) " replayed=" (inputreplayed)); delbot]
        sleep 400 [loadstate]
        sleep 500 [dethashstop; quit]
    ]
]
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log rwb_inputs
racerules 0
mode 0
map (? (=s $rwb_map "") forge $rwb_map)
