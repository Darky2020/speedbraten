// A race life that starts right after taking an item: on forge with race rules, player1 stands
// on a rocket box (the box stays held while they stand on it), then suicides and respawns at
// once. Writes the attempt from the respawn to held.sbr with inputsavelife. Re-simulate it with
// sauer_resim -V (any key): its "lifestart" must be "ok", as a respawn puts items back as at a
// map start.
rh_inputs = [
    sleep 300 [harnessgotoent 10 0]
    sleep 2000 [harnesscommand "suicide"]
    sleep 2100 [harnesscommand "speedrunrespawn"]
    sleep 2800 [harnessattack 1]
    sleep 2900 [harnessattack 0]
    sleep 3500 [inputsavelife held.sbr; dethashstop; quit]
]
soundvol 0
musicvol 0
racerules 1
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log rh_inputs
mode 0
map forge
