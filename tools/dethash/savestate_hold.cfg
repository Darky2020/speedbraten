// Hold after a load: saves the state at 1 s, loads it at 2 s and measures the frame clock
// until the game clock is back at 2 s, i.e. 1 s of game time after the load. With
// loadstatedelay $sh_delay the frame time must be about 1000 + $sh_delay ms.
// Prints REPLAYCHECK hold delay=<setting> frames_ms=<measured>.
sh_inputs = [
    sleep 1000 [savestate]
    sleep 2000 [
        sh_t = (getmillis 1)
        loadstate
        sleep 1 [echo (concatword "REPLAYCHECK hold delay=" $loadstatedelay " frames_ms=" (- (getmillis 1) $sh_t)); dethashstop; quit]
    ]
]
soundvol 0
musicvol 0
loadstatedelay $sh_delay
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log sh_inputs
mode 17
map forge
