// A flagrun recording keeps its rules: recorded with flagrun 1, replayed after flagrun 0.
// Expected: replay rules=1 and no desync.
frr_inputs = [
    sleep 500  [harnessmove 1 0; harnessaim 90 0]
    sleep 1500 [harnesscommand suicide]
    sleep 2500 [echo (concatword "REPLAYCHECK recorded rules=" (flagrunrules)); flagrun 0; dethashstop; dethashstart dethash_replay.log frr_replay; inputreplay 0]
]
frr_replay = [sleep 2600 [echo (concatword "REPLAYCHECK replay rules=" (flagrunrules) " desync=" (inputdesync)); dethashstop; quit]]
soundvol 0
musicvol 0
flagrun 1
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log frr_inputs
mode 17
map forge
