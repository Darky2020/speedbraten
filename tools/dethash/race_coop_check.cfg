// Race rules in coop edit on forge: the timer runs from spawn, entering edit mode voids the
// attempt, a suicide + respawn starts a new attempt from 0. Prints RACECHECK lines.
rc_state = [echo (concatword "RACECHECK " $arg1 " runstate=" (runstate) " runtime=" (runtime))]
rc_inputs = [
    sleep 500 [rc_state spawn]
    sleep 600 [harnesscommand "edittoggle"]
    sleep 800 [rc_state edit]
    sleep 900 [harnesscommand "edittoggle"]
    sleep 1100 [rc_state editoff]
    sleep 1200 [harnesscommand "suicide"]
    sleep 1300 [harnesscommand "speedrunrespawn"]
    sleep 2500 [rc_state respawn; dethashstop; quit]
]
soundvol 0
musicvol 0
racerules 1
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log rc_inputs
mode 1
map forge
