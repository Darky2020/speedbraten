// Map GUI record/replay check on guitest (run with HOMESETUP=guitest_home.sh). The GUI is
// opened from a tick (like a map trigger), clicked twice through the same path as a real
// click, then the current attempt is replayed. The REPLAYCHECK lines of record and replay
// must match.

guireplay_report = [
    echo (concatword "REPLAYCHECK " $arg1 " clicks=" $guitest_clicks " closed=" $guitest_closed " guis=[" (getmapguis) "]")
]
guireplay_inputs = [
    sleep 500  [harnessmove 1 0; showgui guitest]
    sleep 1000 [harnessguiclick guitest_boost]
    sleep 1500 [guireplay_report a; harnessguiclick clearmapguis]
    sleep 2000 [guireplay_report b; showgui guitest]
    sleep 2500 [guireplay_report c]
    sleep 3000 [dethashstop; dethashstart dethash_replay.log guireplay_replay; guitest_clicks = 0; guitest_closed = 0; inputreplay 0]
]
guireplay_replay = [
    sleep 1500 [guireplay_report a]
    sleep 2000 [guireplay_report b]
    sleep 2500 [guireplay_report c]
    sleep 3000 [dethashstop; quit]
]

soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log guireplay_inputs
mode -2
map guitest
