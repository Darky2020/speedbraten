// After a replay runs out, queued live-style input (here a weapon switch) must apply again.
// Expected: REPLAYCHECK after gun=2 (chaingun) in DMSP, where the player starts with ammo.
handback_inputs = [
    sleep 500  [harnessmove 1 0]
    sleep 1000 [dethashstop; inputreplay 0]
    sleep 3000 [echo (concatword "REPLAYCHECK before gun=" (getweapon)); harnesscommand "setweapon CG 1"]
    sleep 3500 [echo (concatword "REPLAYCHECK after gun=" (getweapon)); quit]
]
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log handback_inputs
mode -2
map complex
