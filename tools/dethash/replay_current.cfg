// Records a short attempt on $dethash_map in mode $dethash_mode, then replays the current
// attempt into dethash_replay.log (compare with compare.py --attempt 0).

replaycur_inputs = [
    sleep 500  [harnessaim 90 0; harnessmove 1 0]
    sleep 1500 [harnessjump; harnessaim 180 0]
    sleep 3000 [echo (concatword "REPLAYCHECK recorded team=" (getteam)); dethashstop; dethashstart dethash_replay.log replaycur_end; inputreplay 0]
]
replaycur_end = [
    echo (concatword "REPLAYCHECK replay team=" (getteam))
    sleep 3500 [dethashstop; quit]
]

soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log replaycur_inputs
mode $dethash_mode
map $dethash_map
