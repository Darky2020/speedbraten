// Records an attempt on complex (DMSP), moves to dust2 in another mode from inside a sleep,
// then replays the previous attempt. Expected REPLAYCHECK lines: recorded complex -2,
// other dust2 0 (500 ms into dust2), replay complex -2.

replaymap_report = [echo (concatword "REPLAYCHECK " $arg1 " map=" (getclientmap) " mode=" (getmode))]
replaymap_inputs = [
    sleep 500  [harnessaim 90 0; harnessmove 1 0]
    sleep 1500 [replaymap_report recorded; mode 0; map dust2]
    sleep 2000 [replaymap_report other; inputreplay 1]
    sleep 3000 [replaymap_report replay; dethashstop; quit]
]

soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log replaymap_inputs
mode -2
map complex
