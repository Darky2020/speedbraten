// Switching into a flagrun from a running game: the timer must be armed (state 0) and the
// recording must carry flagrun 1 (dumped to dethash_dump.txt).
fs_inputs = [
    sleep 500  [flagrun 1; mode 17; map forge]
    sleep 1500 [echo (concatword "REPLAYCHECK switched rules=" (flagrunrules) " state=" (runstate)); inputdump dethash_dump.txt 0; dethashstop; quit]
]
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log fs_inputs
mode -2
map complex
