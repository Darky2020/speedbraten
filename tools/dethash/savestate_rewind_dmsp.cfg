// Savestate rewind in DMSP on complex: monsters start spawning at 10 s; the state is saved at
// 14 s with monsters alive and fighting, restored at 22 s, and the recorded input is replayed
// from there. Every replayed tick must hash exactly as it did when it was recorded.
// Prints REPLAYCHECK rewind desync=<first desync tick, 0 = none> replayed=<ticks replayed> and the monster count.
rwd_inputs = [
    sleep 500   [harnessaim 90 0; harnessmove 1 0]
    sleep 2000  [harnessjump]
    sleep 3000  [harnessaim 180 -10; harnessmove 0 1]
    sleep 6000  [harnessaim 270 0; harnessattack 1]
    sleep 9000  [harnessattack 0; harnessaim 45 5; harnessmove 1 0]
    sleep 12000 [harnessattack 1]
    sleep 13000 [harnessattack 0; harnessaim 135 0]
    sleep 14000 [savestate; echo (concatword "REPLAYCHECK saved monsters=" (nummonsters))]
    sleep 15000 [harnessmove 0 -1; harnessjump]
    sleep 17000 [harnessaim 0 -20; harnessmove 1 1; harnessattack 1]
    sleep 20000 [harnessattack 0; harnessaim 200 0; harnessmove 1 0]
    sleep 22000 [echo (concatword "REPLAYCHECK monsters=" (nummonsters)); loadstatereplay; sleep 300 [echo (concatword "REPLAYCHECK rewind desync=" (inputdesync) " replayed=" (inputreplayed) " monsters=" (nummonsters)); dethashstop; quit]]
]
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log rwd_inputs
mode -2
map complex
