// Segmented run on forge in a flagrun: rocket jumps, a manual savestate at 4 s, two quick
// loadautostate presses at 5.2 s (stepping back through the automatic states), a suicide,
// then loadstate at 7 s; the session ends at 10 s. With replaylifeonly 0 the whole recording
// is saved as an unfinished replay that carries the splices (file name ends in _dnf_seg). It
// must replay without desync in a fresh process. The saves and loads run between ticks, as from
// a key. Prints REPLAYCHECK lines with the run state.
sg_jump = [
    sleep $arg1 [harnessjump]
    sleep (+ $arg1 60) [harnessattack 1]
    sleep (+ $arg1 120) [harnessattack 0]
]
sg_inputs = [
    sleep 300 [harnesscommand "setweapon 3 1"; harnessaim 0 -89; harnessmove 1 0]
    loop k 10 [sg_jump (+ 600 (* $k 900))]
    sleep 4000 [harnessguiclick savestate]
    sleep 5200 [harnessguiclick loadautostate]
    sleep 5260 [harnessguiclick loadautostate]
    sleep 6300 [harnesscommand suicide]
    sleep 7000 [harnessguiclick loadstate]
    sleep 10000 [echo (concatword "REPLAYCHECK segmented ticks=" (inputtick)); dethashstop; quit]
]
soundvol 0
musicvol 0
replaylifeonly 0
flagrun 1
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log sg_inputs
mode 17
map forge
