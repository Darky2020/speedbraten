// A live load keeps the keys held now: the state is saved while moving forward and shooting,
// both are let go, then the state is loaded. Afterwards the player must neither move nor
// shoot. Prints REPLAYCHECK keys move=0 strafe=0 attacking=0.
sk_inputs = [
    sleep 300  [harnessmove 1 0; harnessattack 1]
    sleep 1000 [savestate]
    sleep 1500 [harnessmove 0 0; harnessattack 0]
    sleep 2000 [loadstate]
    sleep 2100 [echo (concat "REPLAYCHECK keys" (harnessinput)); dethashstop; quit]
]
soundvol 0
musicvol 0
loadstatedelay 0
flagrun 1
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log sk_inputs
mode 17
map forge
