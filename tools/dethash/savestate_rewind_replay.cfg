// Savestate rewind inside a replay: plays $rwr_load, saves the state at $rwr_save ms, restores
// it at $rwr_rewind ms and lets the replay go on from the restored tick to its end
// ($rwr_end ms). Every tick after the rewind must hash as recorded in the replay.
// Prints REPLAYCHECK rewind desync=<first desync tick, 0 = none> replayed=<ticks replayed>.
rwr_start = [
    sleep $rwr_save [savestate]
    sleep $rwr_rewind [
        loadstatereplay
        sleep (+ (- $rwr_end $rwr_rewind) 500) [echo (concatword "REPLAYCHECK rewind desync=" (inputdesync) " replayed=" (inputreplayed)); dethashstop; quit]
    ]
]
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
dethashstart dethash.log rwr_start
inputload $rwr_load
