// Life-only replay from a finished flagrun or race replay: plays $lf_load and, once it has
// ended ($lf_end ms), writes the attempt from the spawn of player1's last life to life.sbr
// with inputsavelife. Play life.sbr afterwards (resimcheck.sh): it must replay without desync
// and finish with the same run time.
lf_start = [sleep (+ $lf_end 200) [inputsavelife life.sbr; dethashstop; quit]]
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
dethashstart dethash.log lf_start
inputload $lf_load
