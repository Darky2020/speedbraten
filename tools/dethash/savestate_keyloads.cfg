// Segmented session on skrsp1 (gold pack: HOMESETUP=gold_home.sh with RESIMDATA) with saves
// and loads run between ticks, as from keys: manual saves, quick double step-backs, manual
// loads, while moving, jumping and shooting with monsters around. The saved _dnf_seg replay
// must replay without desync (sauer_resim). Loading an automatic state between ticks used to
// leave the game clock one tick ahead of the replay.
st_inputs = [
    sleep 300 [harnessaim 90 0; harnessmove 1 0]
    loop k 20 [
        sleep (+ 1000 (* $k 1700)) [harnessaim (* $k 37) 0; harnessjump; harnessattack 1]
        sleep (+ 1200 (* $k 1700)) [harnessattack 0; harnessmove 1 (- (mod $k 3) 1)]
    ]
    sleep 3100  [harnessguiclick savestate]
    sleep 5150  [harnessguiclick loadautostate]
    sleep 5170  [harnessguiclick loadautostate]
    sleep 7300  [harnessguiclick savestate]
    sleep 9100  [harnessguiclick loadautostate]
    sleep 10300 [harnessguiclick loadstate]
    sleep 12450 [harnessguiclick loadautostate]
    sleep 13900 [harnessguiclick savestate]
    sleep 15200 [harnessguiclick loadautostate]
    sleep 15210 [harnessguiclick loadautostate]
    sleep 16900 [harnessguiclick loadstate]
    sleep 19000 [harnessguiclick loadautostate]
    sleep 25000 [dethashstop; quit]
]
soundvol 0
musicvol 0
loadstatedelay 1000
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log st_inputs
mode -3
map skrsp1
