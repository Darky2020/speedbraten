// SP run timer across a map-script map chain (run with HOMESETUP=chain_home.sh and
// dethash_map = chaina or chainb). chaina -> chainb must give 0:01.700 (200 + 140 ticks),
// starting on chainb alone 0:00.700.
runtimer_end = [sleep 3000 [echo (concatword "REPLAYCHECK runtime=" (runtime) " state=" (runstate)); dethashstop; quit]]
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log runtimer_end
mode -3
map $dethash_map
