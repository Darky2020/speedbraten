// Flagrun rules on forge (efficctf, flagrun 1): own flag scored at the enemy flag (timed),
// instant return of a dropped flag, instant respawn, and no capture limit (11 captures).
// Expected REPLAYCHECK lines: own run=1000 flags=1; taken held=1; drop held=0 state=0 (timer re-armed);
// respawn pstate=0 (alive); captures flags=12 with no intermission line.
intermission = [echo "REPLAYCHECK intermission"]
fr_report = [echo (concatword "REPLAYCHECK " $arg1 " run=" (runtime) " state=" (runstate) " flags=" (getflags) " pstate=" (harnessstate) " held=" (hasflag (getclientnum)))]
fr_cycle = [
    sleep (+ $arg1 0)   [harnessflag 0 0]
    sleep (+ $arg1 100) [harnessflag 0 30]
    sleep (+ $arg1 200) [harnessflag 1 0]
]
fr_inputs = [
    sleep 500  [harnessflag 1 0]
    sleep 1000 [harnessflag 1 30]
    sleep 2000 [harnessflag 0 0]
    sleep 2200 [fr_report own]
    sleep 2400 [harnessflag 0 50]
    sleep 2500 [harnessflag 0 0]
    sleep 2600 [fr_report taken; harnessflag 0 80]
    sleep 2700 [harnesscommand dropflag]
    sleep 2800 [fr_report drop]
    sleep 3000 [harnesscommand suicide]
    sleep 3100 [fr_report respawn]
    loop i 11 [fr_cycle (+ 3500 (* $i 400))]
    sleep 8500 [fr_report captures; dethashstop; quit]
]
soundvol 0
musicvol 0
flagrun 1
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log fr_inputs
mode 17
map forge
