// Replays $dethash_load (an inputdump file) in a fresh process for $dethash_length ms of
// game time and reports the first desync tick (0 = none) and the number of ticks replayed.
dumprep_end = [sleep $dethash_length [echo (concatword "REPLAYCHECK desync=" (inputdesync) " replayed=" (inputreplayed)); dethashstop; quit]]
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
dethashstart dethash.log dumprep_end
inputload $dethash_load
