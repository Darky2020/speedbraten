// DMSP on complex: records 6 s with skill 7, switching to skill 2 from a script at 3 s, then
// replays the attempt with the player's own skill set to 1 and changes it to 9 mid-replay.
// The replay must use the recorded values throughout and give the player's value back at the end.
// Prints REPLAYCHECK with the first desync tick (0 = none) and the skill after the replay.
settings_record = [
    sleep 500  [harnessaim 90 0; harnessmove 1 0; harnessattack 1]
    sleep 3000 [skill 2]
    sleep 6000 [dethashstop; skill 1; dethashstart dethash_replay.log settings_replay; inputreplay 0]
]
settings_replay = [
    sleep 1000 [skill 9]
    sleep 6500 [echo (concatword "REPLAYCHECK replay desync=" (inputdesync) " skill=" $skill); dethashstop; quit]
]
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
skill 7
dethashstart dethash.log settings_record
mode -2
map complex
