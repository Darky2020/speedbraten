// Flagrun timer on forge (efficctf, flagrun 1): take the enemy flag, leave its sphere at 1 s, score at
// 2 s. Expected run time 0:01.000.
flagrun_inputs = [
    sleep 500  [harnessflag 0 0]
    sleep 1000 [harnessflag 0 30]
    sleep 1500 [echo (concatword "REPLAYCHECK mid runtime=" (runtime) " state=" (runstate))]
    sleep 2000 [harnessflag 1 0]
    sleep 2500 [echo (concatword "REPLAYCHECK end runtime=" (runtime) " state=" (runstate)); dethashstop; quit]
]
soundvol 0
musicvol 0
flagrun 1
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log flagrun_inputs
mode 17
map forge
