// A CTF attempt recorded right after a DMSP map must re-simulate cleanly in a fresh process:
// DMSP sets monster bookkeeping (next spawn time, start time) that CTF never uses, and it
// must not leak into the CTF attempt's state hashes. Afterwards, re-simulate the saved
// forge replay with sauer_resim: expected ok, no desync.
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
mode -2
map complex
stale_probe = [sleep 45 [harnessplayer]]
sleep 3000 [mode 17; dethashstart stale.log stale_probe; map forge]
sleep 8000 [disconnect; quit]
