// Records a short DMSP attempt with scripted input and writes it with inputdump to
// dethash_dump.txt in the home dir.
dumprec_inputs = [
    sleep 500  [harnessaim 90 0; harnessmove 1 0]
    sleep 1500 [harnessjump; harnessaim 180 -10]
    sleep 2500 [harnessaim 270 0; harnessattack 1]
    sleep 3500 [harnessattack 0; harnessmove 0 1]
    sleep 5000 [inputdump dethash_dump.txt 0; dethashstop; quit]
]
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log dumprec_inputs
mode -2
map complex
