// Multi-map replay (HOMESETUP=chain_home.sh): chaina -> chainb is recorded as one run of two
// maps and replayed as one; both must report run time 1700 and the replay no desync.
cr_report = [echo (concatword "REPLAYCHECK " $arg1 " runtime=" (runtime) " maps=" (inputmaps 0) " desync=" (inputdesync) " map=" (getclientmap))]
cr_inputs = [
    sleep 500 [harnessmove 1 0]
    sleep 3000 [cr_report recorded; dethashstop; dethashstart dethash_replay.log cr_replay; inputreplay 0]
]
cr_replay = [sleep 2500 [cr_report replay; dethashstop; quit]]
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log cr_inputs
mode -3
map chaina
