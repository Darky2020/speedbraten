// Race rules on forge in ffa, with racerules = $race_on. Prints RACECHECK lines (plus
// harnessplayer's health/ammo lines): timer after spawn, health after the spawn grenade
// explodes at the feet, rocket ammo after standing on a rocket box, health after a rocket at
// the feet, and the timer after touching a flag. Then replays the attempt with racerules 0;
// the teleports are not recorded, so the replay must first desync at the first teleport
// (tick 601), not earlier.
rc_state = [echo (concatword "RACECHECK " $arg1 " runstate=" (runstate) " runtime=" (runtime) " speed=" (getspeed 1)); harnessplayer]
rc_inputs = [
    sleep 300 [rc_state spawn; harnesscommand "setweapon 5 1"; harnessaim 0 -89]
    sleep 600 [harnessattack 1]
    sleep 700 [harnessattack 0]
    sleep 2900 [rc_state grenade]
    sleep 3000 [harnessgotoent 10 0]
    sleep 5000 [rc_state ammo; harnesscommand "setweapon 3 1"]
    sleep 5300 [harnessattack 1]
    sleep 5400 [harnessattack 0]
    sleep 5900 [rc_state rocket]
    sleep 6200 [harnessgotoent 30 0]
    sleep 6700 [rc_state flag]
    sleep 7000 [racerules 0; dethashstop; dethashstart dethash_replay.log rc_replay; inputreplay 0]
]
rc_replay = [
    sleep 7500 [echo (concatword "RACECHECK replay desync=" (inputdesync)); dethashstop; quit]
]
soundvol 0
musicvol 0
racerules $race_on
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log rc_inputs
mode 0
map forge
