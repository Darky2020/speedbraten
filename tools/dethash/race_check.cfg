// Race rules on nadefly in ffa, with racerules = $race_on (run with HOMESETUP=race_home.sh,
// which provides the map). Prints RACECHECK lines (plus harnessplayer's health/ammo lines): timer
// after spawn, health after the spawn grenade explodes at the feet, the timer away from the goal,
// and the timer once the eye is at the goal flag. Then replays the attempt with racerules 0; the
// harness moves are not recorded, so the replay must first desync at the first one (tick 603),
// not earlier.
rc_state = [echo (concatword "RACECHECK " $arg1 " runstate=" (runstate) " runtime=" (runtime) " speed=" (getspeed 1)); harnessplayer]
rc_inputs = [
    sleep 300 [rc_state spawn; harnesscommand "setweapon 5 1"; harnessaim 0 -89]
    sleep 600 [harnessattack 1]
    sleep 700 [harnessattack 0]
    sleep 2900 [rc_state grenade]
    sleep 3000 [harnessgoal 100 0 0]
    sleep 4400 [rc_state away]
    sleep 4500 [harnessgoal 0 0 0]
    sleep 4600 [rc_state goal]
    sleep 5000 [racerules 0; dethashstop; dethashstart dethash_replay.log rc_replay; inputreplay 0]
]
rc_replay = [
    sleep 5500 [echo (concatword "RACECHECK replay desync=" (inputdesync)); dethashstop; quit]
]
soundvol 0
musicvol 0
racerules $race_on
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log rc_inputs
mode 0
map nadefly
