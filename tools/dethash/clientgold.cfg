// Plays the only replay in the home dir's replays/ in a real client, then prints its result
// a few seconds after it has run out and quits.
hubhost ""
soundvol 0
musicvol 0
fixedframe 5
fixedframedraw 4
// cheapest rendering: CI runners draw with software OpenGL
shaderdetail 0
texreduce 12
envmapsize 4
reflectsize 6
waterreflect 0
waterrefract 0
waterfade 0
caustics 0
glare 0
grass 0
shadowmap 0
maxdynlights 0
depthfx 0
maxparticles 10
hudgun 0
replayendhold 0
replayscan
goldlen = (replayfield 0 length)
goldcolon = (strstr $goldlen ":")
goldwait = (*f (+f (+f (*f (substr $goldlen 0 $goldcolon) 60) (substr $goldlen (+ $goldcolon 1))) 6) 1000)
echo (concatword "GOLDWAIT length=" $goldlen " wait_ms=" $goldwait)
sleep 3000 [replayplay 0]
sleep (+ $goldwait 3000) [
    echo (concatword "GOLDCHECK desync=" (inputdesync) " runtime_ms=" (runtime) " runstate=" (runstate) " recorded=" (replayfield 0 runtime))
    quit
]
