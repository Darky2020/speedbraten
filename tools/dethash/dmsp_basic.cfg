// Scripted DMSP run for the determinism harness. Sleep delays are game time measured
// from the first simulated frame. Expects run.sh to set dethash_seed, dethash_draw and
// dethash_fixed (0 = real wall clock)
// (seed 0 = a random gameplay seed, as in normal play). With dethash_replay set, the
// recorded attempt (0 = current, 1 = the one before) is then replayed from its input stream
// into dethash_replay.log.

dethash_inputs = [
    sleep 500   [harnessaim 90 0; harnessmove 1 0]
    sleep 2000  [harnessjump]
    sleep 3000  [harnessaim 180 -10; harnessmove 0 1]
    sleep 4500  [harnessmove 1 -1; harnessjump]
    sleep 6000  [harnessaim 270 0; harnessattack 1]
    sleep 7000  [harnessattack 0; harnessmove -1 0]
    sleep 9000  [harnessaim 45 5; harnessmove 1 0; harnessstall $dethash_stall]
    sleep 12000 [harnessattack 1]
    sleep 13000 [harnessattack 0; harnessaim 135 0]
    sleep 15000 [harnessmove 0 -1; harnessjump]
    sleep 17000 [harnessaim 0 -20; harnessmove 1 1; harnessattack 1]
    sleep 20000 [harnessattack 0; harnessaim 200 0; harnessmove 1 0; harnessstall $dethash_stall]
    sleep 23000 [harnessattack 1; harnessjump]
    sleep 26000 [harnessattack 0; harnessmove 0 0; harnessaim 300 10]
    sleep 28000 [harnessattack 1]
    sleep 30000 [
        dethashstop
        if (!=s $dethash_replay "") [dethashstart dethash_replay.log dethash_replayend; inputreplay $dethash_replay] [quit]
    ]
]

dethash_replayend = [sleep 30000 [dethashstop; quit]]

soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log dethash_inputs
mode -2
map complex
