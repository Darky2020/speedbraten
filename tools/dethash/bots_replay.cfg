// Offline ffa on forge with two bots, player standing still. Records 10 s, then replays the
// attempt in the same process and prints REPLAYCHECK with the first desync tick (0 = none).
// The bots are added through recorded input, so the replay adds them in the same tick.
bots_record = [
    sleep 300 [harnesscommand "addbot 50"; harnesscommand "addbot 50"]
    sleep 10000 [dethashstop; dethashstart dethash_replay.log bots_replay; inputreplay 0]
]
bots_replay = [
    sleep 10500 [echo (concatword "REPLAYCHECK replay desync=" (inputdesync)); dethashstop; quit]
]
soundvol 0
musicvol 0
fixedframe $dethash_fixed
fixedframedraw $dethash_draw
fixedgameseed $dethash_seed
dethashstart dethash.log bots_record
racerules 0
mode 0
map forge
